{% extends "base.html" %}

{% block title %}Edit Member - Gym Management System{% endblock %}

{% block content %}

<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Edit Member</h1>
    <a href="{{ url_for('members') }}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Back to Members
    </a>
</div>

<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Edit Member Details</h6>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_member', id=member.id) }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ member.name }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" name="email" value="{{ member.email }}" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" class="form-control" name="phone" value="{{ member.phone }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Membership Plan</label>
                        <select class="form-control" name="membership_plan">
                            <option value="monthly" {% if member.membership_plan == 'monthly' %}selected{% endif %}>Monthly</option>
                            <option value="quarterly" {% if member.membership_plan == 'quarterly' %}selected{% endif %}>Quarterly</option>
                            <option value="annual" {% if member.membership_plan == 'annual' %}selected{% endif %}>Annual</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Fitness Goal</label>
                        <select class="form-control" name="goal">
                            <option value="Weight Loss" {% if member.goal == 'Weight Loss' %}selected{% endif %}>Weight Loss</option>
                            <option value="Muscle Gain" {% if member.goal == 'Muscle Gain' %}selected{% endif %}>Muscle Gain</option>
                            <option value="General Fitness" {% if member.goal == 'General Fitness' %}selected{% endif %}>General Fitness</option>
                            <option value="Endurance" {% if member.goal == 'Endurance' %}selected{% endif %}>Endurance</option>
                            <option value="Flexibility" {% if member.goal == 'Flexibility' %}selected{% endif %}>Flexibility</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-control" name="status">
                            <option value="active" {% if member.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="inactive" {% if member.status == 'inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save mr-1"></i> Update Member
            </button>
            <a href="{{ url_for('members') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
