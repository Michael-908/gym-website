{% extends "base.html" %}
{% block title %}Edit Member - Gym Management System{% endblock %}

{% block content %}

<div style="margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
        <h4 style="font-size:1.1rem;font-weight:700;color:#E6EDF3;margin:0;">
            <i class="fas fa-user-edit" style="color:#F59E0B;margin-right:8px;"></i>Edit Member
        </h4>
        <p style="font-size:0.8rem;color:#8B949E;margin:4px 0 0;">Update member details, plan and status.</p>
    </div>
    <a href="{{ url_for('members') }}" class="t-btn t-btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Members
    </a>
</div>

<div class="t-card" style="max-width:720px;">
    <div class="t-card-header">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="t-avatar">{{ member.name[0].upper() }}</div>
            <span>{{ member.name }}</span>
        </div>
        <span class="t-badge {{ 't-badge-success' if member.status == 'active' else 't-badge-danger' }}">{{ member.status }}</span>
    </div>
    <div class="t-card-body">
        <form method="POST" action="{{ url_for('edit_member', id=member.id) }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ member.name }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Email Address</label>
                        <input type="email" class="form-control" name="email" value="{{ member.email }}" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Phone Number</label>
                        <input type="text" class="form-control" name="phone" value="{{ member.phone or '' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Membership Plan</label>
                        <select class="form-control" name="plan_id">
                            <option value="">No Plan</option>
                            {% for plan in plans %}
                            <option value="{{ plan.id }}" {% if member.plan_id == plan.id %}selected{% endif %}>
                                {{ plan.name }} — KSh {{ "%.0f"|format(plan.price) }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Fitness Goal</label>
                        <select class="form-control" name="goal">
                            <option value="Weight Loss" {% if member.goal == 'Weight Loss' %}selected{% endif %}>Weight Loss</option>
                            <option value="Muscle Gain" {% if member.goal == 'Muscle Gain' %}selected{% endif %}>Muscle Gain</option>
                            <option value="General Fitness" {% if member.goal == 'General Fitness' %}selected{% endif %}>General Fitness</option>
                            <option value="Endurance" {% if member.goal == 'Endurance' %}selected{% endif %}>Endurance</option>
                            <option value="Flexibility" {% if member.goal == 'Flexibility' %}selected{% endif %}>Flexibility</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="color:#8B949E;font-size:0.82rem;font-weight:600;">Status</label>
                        <select class="form-control" name="status">
                            <option value="active" {% if member.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="inactive" {% if member.status == 'inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:8px;">
                <button type="submit" class="t-btn t-btn-warning">
                    <i class="fas fa-save"></i> Update Member
                </button>
                <a href="{{ url_for('members') }}" class="t-btn t-btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
