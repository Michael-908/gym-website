{% extends "base.html" %}

{% block title %}Edit Class - Gym Management System{% endblock %}

{% block content %}

<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Edit Class</h1>
    <a href="{{ url_for('classes') }}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Back to Classes
    </a>
</div>

<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Edit Class Details</h6>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_class', id=gym_class.id) }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Class Name</label>
                        <input type="text" class="form-control" name="name"
                            value="{{ gym_class.name }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Trainer</label>
                        <select class="form-control" name="trainer_id">
                            {% for trainer in trainers %}
                            <option value="{{ trainer.id }}"
                                {% if gym_class.trainer_id == trainer.id %}selected{% endif %}>
                                {{ trainer.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Schedule</label>
                        <input type="datetime-local" class="form-control" name="schedule"
                            value="{{ gym_class.schedule.strftime('%Y-%m-%dT%H:%M') if gym_class.schedule else '' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Capacity</label>
                        <input type="number" class="form-control" name="capacity"
                            value="{{ gym_class.capacity }}" min="1" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" name="description"
                            rows="3">{{ gym_class.description }}</textarea>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save mr-1"></i> Update Class
            </button>
            <a href="{{ url_for('classes') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
