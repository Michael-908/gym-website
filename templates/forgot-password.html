<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Forgot Password - Gym Management System</title>
    <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0D1117;
            color: #E6EDF3;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
        }

        /* ── Brand ── */
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #F59E0B, #F85149);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 1.4rem; color: #fff;
            box-shadow: 0 8px 24px rgba(245,158,11,0.3);
        }
        .brand h1 { font-size: 1.35rem; font-weight: 900; color: #E6EDF3; margin-bottom: 6px; }
        .brand p  { font-size: 0.85rem; color: #8B949E; line-height: 1.5; max-width: 300px; margin: 0 auto; }

        /* ── Card ── */
        .card {
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 16px;
            padding: 30px 28px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }

        /* ── Info box ── */
        .info-box {
            background: rgba(26,115,232,0.08);
            border: 1px solid rgba(26,115,232,0.2);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 22px;
            font-size: 0.82rem;
            color: #8B949E;
            line-height: 1.6;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .info-box i { color: #1A73E8; margin-top: 2px; flex-shrink: 0; }

        /* ── Form ── */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.82rem; font-weight: 700;
            color: #8B949E; margin-bottom: 8px;
        }
        .input-wrap { position: relative; }
        .input-wrap .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #8B949E; font-size: 0.85rem; pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: #0D1117;
            border: 1px solid #30363D;
            border-radius: 10px;
            color: #E6EDF3;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #1A73E8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
        }
        .input-wrap input::placeholder { color: #8B949E; }

        /* ── Button ── */
        .btn-submit {
            width: 100%; padding: 13px;
            background: #1A73E8;
            color: #fff; font-size: 0.95rem; font-weight: 800;
            border: none; border-radius: 10px; cursor: pointer;
            font-family: 'Nunito', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(26,115,232,0.3);
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .btn-submit:hover  { background: #1557B0; }
        .btn-submit:active { transform: scale(0.98); }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 22px 0; color: #8B949E; font-size: 0.78rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #30363D; }

        /* ── Footer links ── */
        .footer-links { text-align: center; display: flex; flex-direction: column; gap: 10px; }
        .footer-links a {
            color: #1A73E8; text-decoration: none; font-size: 0.85rem; font-weight: 600;
        }
        .footer-links a:hover { color: #60A5FA; text-decoration: underline; }
        .footer-links span { color: #8B949E; font-size: 0.82rem; }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 40px); }
            .card { padding: 24px 18px; }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="brand">
        <div class="brand-icon">
            <i class="fas fa-key"></i>
        </div>
        <h1>Forgot Password?</h1>
        <p>Enter your email and we'll send you a reset link to get back into your account.</p>
    </div>

    <div class="card">

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <span>We'll send a password reset link to your registered email address. Check your spam folder if you don't see it within a few minutes.</span>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com"
                           required autocomplete="email">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>

        </form>

        <div class="divider">or</div>

        <div class="footer-links">
            <span>Remember your password?</span>
            <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left" style="margin-right:6px;font-size:0.75rem;"></i>Back to Sign In</a>
            <a href="{{ url_for('register') }}">Create a new account</a>
        </div>

    </div>
</div>

</body>
</html>
